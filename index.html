<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game | By Nino Wolfsen</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body onload="startgame()">
    <script>

        var myGamePiece;

        function startgame() {
            myGameArea.start(); // Width, Height, Color, x, y 
            myGamePiece = new component(30, 30, "darkgreen", 100, 400);
        }

        var myGameArea = {
            canvas : document.createElement("canvas"),
            start : function() {
                this.canvas.width = 800;
                this.canvas.height = 800;
                this.context = this.canvas.getContext("2d");
                document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                this.interval = setInterval(updateGameArea, 20);
                window.addEventListener('keydown', function (e) {
                    myGameArea.keys = (myGameArea.keys || []);
                    myGameArea.keys[e.keyCode] = true;
                })
                window.addEventListener('keyup', function (e) {
                    myGameArea.keys[e.keyCode] = false;
                })
            },
            clear : function() {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        function component(width, height, color, x, y) {
            this.width = width;
            this.height = height;
            this.x = x;
            this.y = y;
            this.update = function() {
                ctx = myGameArea.context;
                ctx.fillStyle = color;
                ctx.fillRect(this.x, this.y, this.width, this.height)
            }
            this.newPos = function() {
                this.x += this.speedX;
                this.y += this.speedY;
            }
        }

        function updateGameArea() {
            myGameArea.clear();
            myGamePiece.speedX = 0;
            myGamePiece.speedY = 0;
            if (myGameArea.keys && myGameArea.keys[37]) {myGamePiece.speedX = -5; }
            if (myGameArea.keys && myGameArea.keys[39]) {myGamePiece.speedX = 5; }
            if (myGameArea.keys && myGameArea.keys[38]) {myGamePiece.speedY = -5; }
            if (myGameArea.keys && myGameArea.keys[40]) {myGamePiece.speedY = 5; }
            myGamePiece.newPos();
            myGamePiece.update();
        }

    </script>

    

</body>
</html>
